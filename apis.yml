aid: firstory
name: Firstory
description: >-
  Firstory is a podcast hosting and monetization platform for creators, holding
  the leading share of the Mandarin-language podcast market and a growing
  presence across the Asia-Pacific region with over 14,000 shows. Creators
  upload an episode once and distribute it to Apple Podcasts, Spotify, KKBOX,
  YouTube, Amazon Music, Pocket Casts, and more than ten other players, then use
  AI Studio to auto-generate transcripts, summaries, highlights, and newsletter
  drafts. Firstory layers on second-by-second analytics, dynamic ad insertion,
  membership subscriptions, listener donations, cross-promotion, a personal
  website builder, the Flink universal link, and embeddable players. It does not
  publish a public developer API; this profile captures the company's public
  surface and infrastructure signals.
